name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check src/

    - name: Run CI tests
      run: |
        # run everything except the integration suites (GPU, model downloads, live servers)
        python -m pytest tests/ --ignore=tests/test_models.py --ignore=tests/test_ray.py --ignore=tests/test_resp.py -v
